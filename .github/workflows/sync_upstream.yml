name: Sync Upstream Changes

on:
  schedule:
    # 每周一上午 10:00 (UTC+8 即 UTC 02:00) 自动触发
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    name: Check Upstream Updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add and Fetch Upstream
        run: |
          git remote add upstream https://github.com/YiHoooong/Mimonitor_Toolbox.git || true
          git fetch upstream master

      - name: Check for new commits
        id: check_commits
        run: |
          LOCAL_BRANCH=$(git branch --show-current || echo "master")
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/master || echo 0)
          echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          echo "检测到上游领先提交数: $BEHIND_COUNT"

      - name: Create Sync Branch and Pull Request
        if: steps.check_commits.outputs.behind_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="upstream-sync-$(date +%Y%m%d)"
          echo "创建同步分支: $SYNC_BRANCH"
          git checkout -b "$SYNC_BRANCH"
          git merge upstream/master -m "chore(sync): 合并上游 master 分支最新提交" --no-edit || true
          git push origin "$SYNC_BRANCH" --force
          
          # 检查是否已存在同名 PR，若无则新建
          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --json number -q '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --title "chore(sync): 检测到上游原作者新提交，请求同步更新" \
              --body "### 🤖 上游同步机器人自动化检测提示

检测到原作者仓库 \`YiHoooong/Mimonitor_Toolbox:master\` 存在新的提交（共 ${{ steps.check_commits.outputs.behind_count }} 个提交领先）。

分支 \`$SYNC_BRANCH\` 已自动抓取上游更新并完成初步合并，请人工审查代码差异与冲突解决后再合并至主分支。" \
              --base master \
              --head "$SYNC_BRANCH"
            echo "已成功创建同步 Pull Request"
          else
            echo "已存在对应的 Pull Request (#$EXISTING_PR)，无需重复创建"
          fi
